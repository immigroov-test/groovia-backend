# Render Blueprint. Commit this file and connect the repo to Render - Render
# detects it, provisions the service, and only asks you to fill the `sync: false`
# secret values from its dashboard.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Production (tracks `main`) ───────────────────────────────────────────────
  - type: web
    name: groovia-api
    runtime: docker
    plan: starter            # free tier; cold-starts after 15 min idle. Upgrade to "standard" once live.
    region: frankfurt        # EU - keeps data near Supabase EU West and stays GDPR-friendly.
    branch: main             # pinned so prod only rebuilds on main.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true         # Render rebuilds on every push to the watched branch.
    envVars:
      # Per-environment / public-ish
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel domain(s), comma-separated
      - key: FRONTEND_URL
        sync: false          # https://your-vercel-domain.com - used for the mentor-directory link in LLM responses

      # Models
      - key: MAIN_MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: REVIEW_MODEL_NAME
        value: llama-3.1-8b-instant

      # Feature flags (default ON - override per environment)
      - key: FEATURE_CHAT_HISTORY
        value: "true"
      - key: FEATURE_GUEST_MODE
        value: "true"
      - key: FEATURE_MENTORS_PUBLIC
        value: "true"
      - key: FEATURE_WEB_SEARCH_TOOL
        value: "true"
      - key: FEATURE_MENTOR_TOOL
        value: "true"
      - key: FEATURE_RESUME_UPLOAD
        value: "true"
      - key: FEATURE_GOOGLE_OAUTH
        value: "true"

      # Secrets - all marked `sync: false` so Render won't overwrite them on each deploy.
      # Set their values in the Render dashboard once.
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false           # Supabase SESSION pooler URI, port 5432 (NOT 6543 - LangGraph uses prepared statements)
      - key: RESEND_API_KEY
        sync: false           # transactional email; optional
      - key: EMAIL_FROM
        sync: false           # must be a Resend-verified sender, e.g. "Immigroov <noreply@yourdomain.com>" - defaults to the Resend sandbox address (onboarding@resend.dev) if unset, which only delivers to the Resend account owner
      - key: ADMIN_EMAIL
        sync: false           # ops inbox copied on booking/reschedule/cancel (e.g. yokeshmd99@gmail.com)
      - key: RAZORPAY_KEY_ID
        sync: false           # live API service handles create-order/webhook directly - needs these, not just the scheduler
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false           # signs webhook deliveries; separate from RAZORPAY_KEY_SECRET

  # ── Scheduler (production) ───────────────────────────────────────────────────
  # Fires jobs/run_due.py - see INFRASTRUCTURE_ARCHITECTURE_PLAN.md §3 for why
  # this is ONE Render Cron Job (not one per task) and DISPATCHER_SAFETY_CHECKLIST.md
  # for why every job it registers is safe to run on a shared 5-minute tick.
  # Needs the full same env as groovia-api (config.py's fail-fast boot check
  # requires it even though the dispatcher itself only touches Supabase/Resend/
  # Razorpay) - duplicated below rather than shared via an env group, matching
  # this file's existing prod/staging convention.
  - type: cron
    name: groovia-scheduler
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m jobs.run_due
    schedule: "*/5 * * * *"    # every 5 min - see architecture plan §3a for the timing justification
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false           # must match groovia-api's verified sender - see note above
      - key: ADMIN_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false           # used in reminder/reference email links (CORS_ORIGINS not needed - no HTTP server here)

  # ── Staging (tracks `staging` branch) ────────────────────────────────────────
  # Point ALL Supabase secrets below at the SEPARATE staging Supabase project,
  # and CORS_ORIGINS / FRONTEND_URL at the staging Vercel URL. See STAGING_SETUP.md.
  - type: web
    name: groovia-api-staging
    runtime: docker
    plan: starter
    region: frankfurt
    branch: staging
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        sync: false           # the staging Vercel URL, e.g. https://groovia-frontend-git-staging-<scope>.vercel.app
      - key: FRONTEND_URL
        sync: false           # same staging Vercel URL

      - key: MAIN_MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: REVIEW_MODEL_NAME
        value: llama-3.1-8b-instant

      - key: FEATURE_CHAT_HISTORY
        value: "true"
      - key: FEATURE_GUEST_MODE
        value: "true"
      - key: FEATURE_MENTORS_PUBLIC
        value: "true"
      - key: FEATURE_WEB_SEARCH_TOOL
        value: "true"
      - key: FEATURE_MENTOR_TOOL
        value: "true"
      - key: FEATURE_RESUME_UPLOAD
        value: "true"
      - key: FEATURE_GOOGLE_OAUTH
        value: "true"

      # Secrets - STAGING Supabase project + shared LLM/search keys.
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false           # staging Supabase project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false           # staging Supabase service role key
      - key: SUPABASE_JWT_SECRET
        sync: false           # staging Supabase JWT secret (Settings → API → JWT Settings)
      - key: DATABASE_URL
        sync: false           # staging Supabase SESSION pooler URI, port 5432 (NOT 6543 - LangGraph uses prepared statements)
      - key: RESEND_API_KEY
        sync: false           # optional - leave unset to skip real emails
      - key: EMAIL_FROM
        sync: false           # must be a Resend-verified sender - defaults to the Resend sandbox address (onboarding@resend.dev) if unset, which only delivers to the Resend account owner
      - key: ADMIN_EMAIL
        sync: false           # ops inbox copied on booking/reschedule/cancel (e.g. yokeshmd99@gmail.com)
      - key: RAZORPAY_KEY_ID
        sync: false           # live API service handles create-order/webhook directly - needs these, not just the scheduler
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false           # signs webhook deliveries; separate from RAZORPAY_KEY_SECRET
      - key: MOCK_SERVICES
        value: "false"        # set "true" to mock Resend/webhooks on staging instead

  # ── Scheduler (staging) ──────────────────────────────────────────────────────
  - type: cron
    name: groovia-scheduler-staging
    runtime: docker
    plan: starter
    region: frankfurt
    branch: staging
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m jobs.run_due
    schedule: "*/5 * * * *"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false           # staging Supabase project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false           # staging Supabase service role key
      - key: SUPABASE_JWT_SECRET
        sync: false           # staging Supabase JWT secret
      - key: DATABASE_URL
        sync: false           # staging Supabase SESSION pooler URI
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false           # must match groovia-api-staging's verified sender - see note above
      - key: ADMIN_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false           # no HTTP server here, so CORS_ORIGINS isn't needed
      - key: MOCK_SERVICES
        value: "false"        # keep in sync with groovia-api-staging above
